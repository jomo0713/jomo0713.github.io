# .github/workflows/douban.yml
name: douban
on: 
  schedule:
  - cron: "30 * * * *"

jobs:
  douban:
    name: Douban mark data sync
    runs-on: ubuntu-latest
    steps:
    - name: movie
      uses: 187848826/doumark-action@master
      with:
        id: 187848826
        type: movie
        format: csv
        dir: ./data/douban
        #notion_token: ${{ secrets.notion_token }}
        
    - name: book
      uses: 187848826/doumark-action@master
      with:
        id: 187848826
        type: book
        format: csv
        dir: ./data/douban
        #notion_token: ${{ secrets.notion_token }}
    - name: Commit
      uses: EndBug/add-and-commit@v8
      with:
        message: 'chore: update douban data'
        add: './data/douban'